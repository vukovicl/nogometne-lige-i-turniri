name: Deploy na GitHub Pages

on:
  push:
    branches: ['main', 'master']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preuzimanje repozitorija
        uses: actions/checkout@v4

      - name: Postavljanje Node.js okruženja
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalacija ovisnosti
        run: npm ci

      - name: Produkcijski build stranice
        run: npm run build

      - name: Konfiguracija GitHub Pagesa
        uses: actions/configure-pages@v5

      - name: Priprema artefakta za objavu
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Objava na GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
